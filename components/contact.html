<section id="contact" class="py-5" style="background: linear-gradient(135deg, #2C302F 60%, #607966 100%);">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="p-4 p-md-5" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(8px);">
          <h4 class="font-heading text-white mb-4">Send Us a Message</h4>
          <form onsubmit="return false">
            <div class="mb-3">
              <label class="form-label text-white font-body small opacity-70">Full Name</label>
              <input type="text" class="form-control contact-input" placeholder="Your Name">
            </div>
            <div class="mb-3">
              <label class="form-label text-white font-body small opacity-70">Phone Number</label>
              <input type="tel" class="form-control contact-input" placeholder="+91 XXXXX XXXXX">
            </div>
            <div class="mb-3">
              <label class="form-label text-white font-body small opacity-70">Email Address</label>
              <input type="email" class="form-control contact-input" placeholder="you@company.com">
            </div>
            <div class="mb-4">
              <label class="form-label text-white font-body small opacity-70">Project Description</label>
              <textarea class="form-control contact-input" rows="4" placeholder="Describe your requirements..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary-theme w-100">Schedule a Site Visit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
